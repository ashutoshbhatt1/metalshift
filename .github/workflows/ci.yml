name: MetalShift CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy framework metalshift
      - name: Run unit, integration, and lifecycle tests
        run: python -m pytest -m "not browser" --junitxml=artifacts/pytest.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-evidence-${{ matrix.python-version }}
          path: artifacts/pytest.xml

  browser-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate the operator dashboard
        run: python -m pytest -m browser --browser chromium --tracing retain-on-failure
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            artifacts/
            test-results/
